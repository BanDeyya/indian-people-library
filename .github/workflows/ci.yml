name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the privacy check also scans commit history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install "uv==0.11.32"
      - name: Run all checks (validator, tests, prompt lint, snapshots, privacy, diversity)
        run: uv run scripts/check_all.py
